spring.application.name=ecotrack
# Directorio donde se guardan residuos.csv y vehiculos.csv (relativo al directorio de trabajo).
ecotrack.data-dir=./data
# Carga los datos de ejemplo de classpath:semilla/ cuando el directorio aún no tiene datos.
ecotrack.semilla=true
# Orígenes del frontend autorizados por CORS (separados por comas).
ecotrack.cors.origenes=http://localhost:5173,http://127.0.0.1:5173
# Respuestas de error en formato RFC 9457 (application/problem+json).
spring.mvc.problemdetails.enabled=true
spring.servlet.multipart.max-file-size=2MB
